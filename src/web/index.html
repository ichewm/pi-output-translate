<div id="app">
	<aside id="sidebar">
		<div class="brand">
			<span class="brand-mark"><svg class="ic " aria-hidden="true"><use href="#i-arrow-left-right"/></svg></span>
			<span class="brand-name">pi 译读</span>
			<button id="btn-sidebar-close" class="icon-btn only-narrow" title="收起"><svg class="ic " aria-hidden="true"><use href="#i-x"/></svg></button>
		</div>
		<div class="side-scroll">
			<div class="side-label">会话</div>
			<div id="session-list" class="list"></div>
			<div class="side-label">历史 · 按项目</div>
			<div id="history-list" class="list"></div>
		</div>
		<div class="side-actions">
			<button id="btn-settings"><svg class="ic " aria-hidden="true"><use href="#i-settings"/></svg> 设置</button>
			<div class="conn-wrap">
				<div id="conn-dot" class="dot off" title="未连接"></div>
				<span id="conn-text" class="conn-text">未连接</span>
			</div>
		</div>
	</aside>

	<div id="scrim" class="scrim hidden"></div>

	<main id="main">
		<header id="topbar">
			<button id="btn-sidebar-open" class="icon-btn only-narrow" title="会话"><svg class="ic " aria-hidden="true"><use href="#i-panel-left"/></svg></button>
			<div class="top-title">
				<span id="cur-session">—</span>
				<span id="pipe-ver" class="pill" title="翻译/渲染管线版本（旧 pi 会话会显示旧版本）">·</span>
				<span id="engine-info" class="pill"></span>
			</div>
			<div class="toggles">
				<div class="toggle" id="tg-dual" title="译文下方常显原文">
					<span class="tg-ic"><svg class="ic " aria-hidden="true"><use href="#i-arrow-left-right"/></svg></span><span class="tg-lb">对照</span>
				</div>
				<div class="toggle on" id="tg-follow" title="新内容到达时自动滚动">
					<span class="tg-ic"><svg class="ic " aria-hidden="true"><use href="#i-arrow-down-to-line"/></svg></span><span class="tg-lb">跟随</span>
				</div>
				<div class="toggle" id="tg-think" title="展开思考过程">
					<span class="tg-ic"><svg class="ic " aria-hidden="true"><use href="#i-brain"/></svg></span><span class="tg-lb">思考</span>
				</div>
			</div>
		</header>

		<div id="pipe-wrap" class="pipe-idle" title="翻译管线：累积 → 攒批 → 翻译 → 完成。条长 = 剩余未翻译量">
			<div class="pipe-bar">
				<div class="pipe-fill" id="pipe-fill"></div>
				<div class="pipe-mark" id="pipe-mark"></div>
			</div>
			<div class="pipe-row">
				<span class="pipe-label" id="pipe-label">队列空闲</span>
				<span class="pipe-stages">
					<span class="stage" id="st-acc"><svg class="ic " aria-hidden="true"><use href="#i-inbox"/></svg><b id="n-acc">0</b><s>累积</s></span>
					<span class="st-arrow">▸</span>
					<span class="stage" id="st-bat"><svg class="ic " aria-hidden="true"><use href="#i-package"/></svg><b id="n-bat">–</b><s>批×?</s></span>
					<span class="st-arrow">▸</span>
					<span class="stage" id="st-fly"><svg class="ic " aria-hidden="true"><use href="#i-sparkles"/></svg><b id="n-fly">0</b><s>翻译中</s></span>
					<span class="st-arrow">▸</span>
					<span class="stage" id="st-done"><svg class="ic " aria-hidden="true"><use href="#i-circle-check"/></svg><b id="n-done">0</b><s>已完成</s></span>
				</span>
			</div>
		</div>

		<div id="flow"><div id="empty-state" class="empty">
			<div class="empty-ic"><svg class="ic " aria-hidden="true"><use href="#i-languages"/></svg></div>
			<div class="empty-t1">还没有内容</div>
			<div class="empty-t2">在任意 pi 终端里开始对话，翻译会实时流到这里。<br/>切换终端后按任意键，页面自动跟随。</div>
		</div></div>

		<button id="btn-bottom" class="to-bottom hidden" title="回到底部">
			<span id="queue-info"></span><span class="arr"><svg class="ic " aria-hidden="true"><use href="#i-arrow-down-to-line"/></svg></span>
		</button>
	</main>
</div>

<div id="settings" class="modal hidden">
	<div class="modal-box">
		<div class="modal-head"><b>设置</b><button id="btn-close-settings" class="icon-btn"><svg class="ic " aria-hidden="true"><use href="#i-x"/></svg></button></div>
		<div class="modal-body">
			<fieldset>
				<legend>翻译引擎</legend>
				<div class="row"><label>引擎</label>
					<select id="s-engine">
						<option value="ollama">ollama（默认）</option>
						<option value="openai-compat">openai 兼容 /v1</option>
						<option value="pi-model">pi 已配置模型</option>
					</select>
				</div>
				<div class="row"><label>地址</label><input id="s-baseurl" placeholder="http://127.0.0.1:11434" /></div>
				<div class="row"><label>API Key</label><input id="s-apikey" type="password" placeholder="（可选）" /></div>
				<div class="row"><label>模型</label><input id="s-model" list="s-models" placeholder="qwen3:8b" /><datalist id="s-models"></datalist></div>
				<div class="row"><label>pi 模型</label><input id="s-pimodel" placeholder="provider/model-id（pi-model 引擎用）" /></div>
				<div class="row"><label>目标语言</label><input id="s-lang" placeholder="zh-Hans" /></div>
				<div class="row actions">
					<button id="btn-models">拉取模型列表</button>
					<button id="btn-test">试翻一句</button>
					<span id="test-result"></span>
				</div>
			</fieldset>
			<fieldset>
				<legend>内容源</legend>
				<div class="checks">
					<label class="switch"><input type="checkbox" id="s-src-text" checked /><i></i>翻译回答正文</label>
					<label class="switch"><input type="checkbox" id="s-src-think" checked /><i></i>翻译 thinking</label>
					<label class="switch"><input type="checkbox" id="s-src-user" checked /><i></i>显示用户消息</label>
					<label class="switch"><input type="checkbox" id="s-src-tools" checked /><i></i>显示工具行</label>
				</div>
				<div class="row"><label>代码注释</label>
					<select id="s-codecomments">
						<option value="off">不翻译（默认）</option>
						<option value="below">译后附在代码块下方</option>
					</select>
				</div>
				<div class="row"><label>无页面时</label>
					<select id="s-idle">
						<option value="text-only">继续翻正文（进缓存）</option>
						<option value="none">完全停止</option>
						<option value="full">全部照翻（含 thinking）</option>
					</select>
				</div>
			</fieldset>
			<fieldset>
				<legend>性能</legend>
				<div class="row"><label>单段超时(s)</label><input id="s-timeout" type="number" min="5" max="600" /></div>
				<div class="row"><label>批量窗口(ms)</label><input id="s-batchwin" type="number" min="50" max="5000" /></div>
				<div class="row"><label>每批段数</label><input id="s-batchsize" type="number" min="1" max="16" /></div>
				<div class="row"><label>并发</label><input id="s-conc" type="number" min="1" max="2" /></div>
			</fieldset>
			<fieldset>
				<legend>术语表（每行 english=中文）</legend>
				<textarea id="s-glossary" rows="6" spellcheck="false"></textarea>
			</fieldset>
			<fieldset>
				<legend>缓存</legend>
				<div class="row actions">
					<span id="cache-stats">—</span>
					<button id="btn-cache-refresh">刷新</button>
					<button id="btn-cache-clear">清空缓存</button>
				</div>
			</fieldset>
		</div>
		<div class="modal-foot">
			<span id="save-result"></span>
			<button id="btn-save" class="primary">保存（热应用）</button>
		</div>
	</div>
</div>
<script type="module" src="./app.js?token=__TOKEN__"></script>
</body>
</html>
